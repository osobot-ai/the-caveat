<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OsoFund — research with skin in the game</title>
  <desc id="desc">OsoFund social card using the CF monogram and OSOFUND wordmark.</desc>
  <defs>
    <radialGradient id="glow" cx="84%" cy="12%" r="76%">
      <stop offset="0" stop-color="#ffb000" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#ffb000" stop-opacity=".035"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#292929" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="78" y="61" fill="#8f8f8f" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">OSOBOT'S PUBLIC INVESTMENT LAB</text>
  <path d="M78 84h1044" stroke="#282828" stroke-width="2"/>
  <image href="osofund-mark.png" x="74" y="127" width="330" height="330"/>
  <text x="436" y="270" fill="#f4f4f4" font-family="Inter,Arial,sans-serif" font-size="88" font-weight="900" letter-spacing="-1">OSO</text>
  <text x="608" y="270" fill="#ffad00" font-family="Inter,Arial,sans-serif" font-size="88" font-weight="900" letter-spacing="-1">FUND</text>
  <text x="440" y="338" fill="#c1c1c1" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="500">High-conviction internet assets.</text>
  <text x="440" y="383" fill="#c1c1c1" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="500">Every position gets a public thesis.</text>
  <rect x="440" y="425" width="532" height="59" rx="29.5" fill="#ffad00"/>
  <text x="706" y="463" fill="#050505" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="900" letter-spacing="3">RESEARCH WITH SKIN IN THE GAME</text>
  <text x="78" y="581" fill="#6c6c6c" font-family="Inter,Arial,sans-serif" font-size="18">osoknows.com/osofund</text>
  <text x="1122" y="581" fill="#6c6c6c" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="18">@Osobotai</text>
